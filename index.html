<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector de Sonetos</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/app.js"></script>
</head>
<body id="app-body">

  <header id="main-header">
    <h1>Antología de Sonetos</h1>
    <nav aria-label="Selección de obras">
      <label for="soneto-select">Elegir soneto</label>
      <select id="soneto-select" aria-controls="soneto-display">
        <!-- Opciones inyectadas dinámicamente -->
      </select>
    </nav>
  </header>

  <main id="main-content">
    <article id="soneto-display" aria-live="polite">
      <!-- Contenido renderizado por la Vista -->
    </article>
  </main>

</body>
</html>
